[package]
name = "watershed-jvm"
version = "0.1.0"
publish = false
description = "Kotlin and JVM bindings for watershed, generated with UniFFI"
edition = "2024"
license = "Apache-2.0"
# UniFFI's bindings generator needs this; the engine itself builds with 1.85.
rust-version = "1.88"

[lib]
name = "watershed_jvm"
# cdylib is what the JVM loads; lib lets the bindings generator below link it.
crate-type = ["cdylib", "lib"]
doctest = false

[[bin]]
# Writes the Kotlin side from the built library:
#   cargo run --bin uniffi-bindgen -- generate --library <lib> --language kotlin --out-dir <dir>
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.32", features = ["cli"] }
watershed-core = { version = "0.1.0", path = "../watershed-core" }

# Not the workspace's lints: those forbid unsafe code, and the code UniFFI
# generates to cross into the JVM is unsafe by nature. Nothing written by
# hand in this crate is.
[lints.clippy]
all = { level = "warn", priority = -1 }

# On its own, outside the repository's workspace (see the root Cargo.toml).
[workspace]
