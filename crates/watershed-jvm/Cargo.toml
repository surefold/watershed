[package]
name = "watershed-jvm"
version = "0.1.0"
publish = false
description = "The engine as a C library for the JVM, called from Kotlin and Scala"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "watershed_jvm"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
watershed-core = { version = "0.1.0", path = "../watershed-core" }

# Not the workspace's lints: those forbid unsafe code, and a C library has to
# read what it is pointed at. All of it is in src/ffi.rs.
[lints.clippy]
all = { level = "warn", priority = -1 }
