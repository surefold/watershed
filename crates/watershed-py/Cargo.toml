[package]
name = "watershed-py"
version = "0.1.0"
publish = false
description = "Python bindings for watershed, built with PyO3 and maturin"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "watershed"
crate-type = ["cdylib"]
# The extension is tested from Python (crates/watershed-py/tests, run with
# `uv run pytest`); a Rust test binary would need to link libpython.
test = false
doctest = false

[dependencies]
pyo3 = { version = "0.30.1", features = ["abi3-py39"] }
watershed-core = { version = "0.1.0", path = "../watershed-core" }

[lints]
workspace = true
