name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every job runs on the surefold organisation's self-hosted Mac (macbook-air), one at a
# time. It is someone's own computer, so each job starts with the `rust-homes` step below,
# which gives CI its own copy of Rust and the downloaded crates, away from theirs.
#
# Each job stops after 30 minutes. The slowest takes about two, and with one runner a
# step that hangs would otherwise hold it for GitHub's default of six hours.

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  format:
    name: Formatting
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      # Written out once here; the other jobs reuse it as `*rust-homes`. It runs first
      # because the toolchain and build steps read these variables. In a shared
      # ~/.cargo, one job's cache clean-up deletes crate sources another job is
      # compiling; in a shared ~/.rustup, `rustup default` switches another job's Rust.
      # Installing rustup here means dtolnay/rust-toolchain skips its own install, which
      # would add these folders to the machine's shell start-up files.
      - &rust-homes
        name: Use this runner's own Rust folders
        shell: bash
        run: |
          export CARGO_HOME="$RUNNER_WORKSPACE/.cargo"
          export RUSTUP_HOME="$RUNNER_WORKSPACE/.rustup"
          curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail https://sh.rustup.rs | sh -s -- --default-toolchain none --no-modify-path -y
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          # Compiled crates stay on disk between runs, one folder per job and Rust
          # version, so a run only rebuilds what changed. This replaces
          # Swatinem/rust-cache, whose save step runs `sudo purge` on macOS and so
          # waits for a password that never comes.
          echo "CARGO_TARGET_DIR=$RUNNER_WORKSPACE/target/${{ github.job }}-${{ matrix.rust || 'stable' }}" >> "$GITHUB_ENV"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  lint:
    name: Lint (clippy)
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - *rust-homes
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # The engine without the `parallel` feature, as the WebAssembly build uses it.
      - run: cargo clippy --locked -p watershed-core --no-default-features --all-targets -- -D warnings

  test:
    name: Tests (Rust ${{ matrix.rust }})
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # stable, and the oldest version the project promises to support
        # (rust-version in Cargo.toml).
        rust: [stable, "1.85"]
    steps:
      - *rust-homes
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      # Debug build: internal checks are on, so a type-checker gap fails loudly.
      - run: cargo test --locked --workspace

  docs:
    name: Docs
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - *rust-homes
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  examples:
    name: Examples
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - *rust-homes
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run --locked --example tour
      # Timings on shared CI machines are too noisy to compare, so this only
      # checks the benchmark runs and that its million-node result matches a
      # full recalculation.
      - run: cargo run --locked --release --example benchmark
      # A 100,000-row collection, checked against adding its rows up from scratch.
      - run: cargo run --locked --release --example collection -- 100000

  web:
    name: Web demo (WebAssembly)
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - *rust-homes
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --locked --release --target wasm32-unknown-unknown -p watershed-web

  python:
    name: Python bindings (uv)
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - *rust-homes
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      # Builds the extension with maturin into a fresh environment, then tests it.
      - run: uv run --locked pytest -q
        working-directory: crates/watershed-py
