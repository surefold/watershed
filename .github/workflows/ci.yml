name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every job runs on GitHub's hosted Linux runners. Each stops after 30 minutes.

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  lint:
    name: Lint (clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # The engine without the `parallel` feature, as the WebAssembly build uses it.
      - run: cargo clippy --locked -p watershed-core --no-default-features --all-targets -- -D warnings

  test:
    name: Tests (Rust ${{ matrix.rust }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # stable, and the oldest version the project promises to support
        # (rust-version in Cargo.toml).
        rust: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      # Debug build: internal checks are on, so a type-checker gap fails loudly.
      - run: cargo test --locked --workspace

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  examples:
    name: Examples
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --locked --example tour
      # Timings on shared CI machines are too noisy to compare, so this only
      # checks the benchmark runs and that its million-node result matches a
      # full recalculation.
      - run: cargo run --locked --release --example benchmark
      # A 100,000-row collection, checked against adding its rows up from scratch.
      - run: cargo run --locked --release --example collection -- 100000
      # A per-loan workbook over 20,000 loans, checked against the values saved
      # in it, LibreOffice's answers for 300 loans, and the graph bit for bit.
      - run: cargo run --locked --release -p watershed-gpu --example credit_loss -- 20000
      # That workbook against a later version of it: the cells changed are
      # found, and which loans a slip in one of them reaches.
      - run: cargo run --locked --release -p watershed-gpu --example audit -- 20000
      # The provision's derivative by 689 of that workbook's inputs, each
      # checked against nudging the input.
      - run: cargo run --locked --release -p watershed-gpu --example sensitivities -- 5000
      # A rating workbook's quotes for 3 of its 50 vehicle groups, checked
      # against LibreOffice's for 300 customers and the graph's for 2,000.
      - run: cargo run --locked --release -p watershed-gpu --example quotes -- 3

  web:
    name: Web demo (WebAssembly)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release --target wasm32-unknown-unknown -p watershed-web

  python:
    name: Python bindings (uv)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      # Builds the extension with maturin into a fresh environment, then tests it.
      - run: uv run --locked pytest -q
        working-directory: crates/watershed-py

  grid-js:
    name: Grid packages and pages (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Builds the engine into packages/grid/pkg and both pages with Vite.
      - run: web/build.sh
      - run: npm run check
      # Browser tests (web/e2e): onEdit with a Table and a WorkerTable, every
      # cookbook recipe in Solid and React, and both grid pages, in Chromium,
      # with every outside service mocked.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # What the publish workflow builds: each package's dist/, with its types.
      - run: npm run build:packages
