[workspace]
resolver = "3"
members = ["crates/watershed-core", "crates/watershed-build", "crates/watershed-py", "crates/watershed-web"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
