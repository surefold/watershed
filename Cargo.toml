[workspace]
resolver = "3"
members = ["crates/watershed-core", "crates/watershed-py", "crates/watershed-web", "crates/watershed-parquet", "crates/watershed-grid", "crates/watershed-jvm"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# `cargo test` only: the random-graph property tests spend most of their time in
# unoptimised code. Light optimisation makes them about four times faster for a few
# seconds of extra compiling. Debug assertions and overflow checks stay on.
[profile.test]
opt-level = 1
