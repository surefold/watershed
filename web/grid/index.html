<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watershed Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<script>
  // Before anything is drawn: inside the playground's tab (?embed), and the theme chosen last time.
  if (new URLSearchParams(location.search).has("embed")) document.documentElement.classList.add("embed");
  try {
    const theme = localStorage.getItem("watershed-grid-theme");
    if (theme) document.documentElement.dataset.wgTheme = theme;
  } catch {}
</script>
</head>
<body>
<script type="module" src="./src/main.tsx"></script>
</body>
</html>
